<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KADO COMBO</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            position: relative;
        }
        
        /* Minimal background effect */
        .bg-effect {
            position: fixed;
            z-index: -1;
            opacity: 0.05;
            pointer-events: none;
        }
        
        .effect-1 {
            top: 10%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #8B0000 0%, transparent 70%);
            filter: blur(40px);
        }
        
        .effect-2 {
            bottom: 10%;
            right: 10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8B0000 0%, transparent 70%);
            filter: blur(50px);
        }
        
        .container {
            background-color: rgba(30, 30, 30, 0.95);
            border-radius: 0;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            border: 1px solid #333;
            position: relative;
            text-align: center;
        }
        
        /* Title */
        .title-container {
            margin-bottom: 50px;
            padding-bottom: 20px;
            position: relative;
        }
        
        h1 {
            font-size: 3.5rem;
            color: #fff;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #888;
            letter-spacing: 2px;
            font-weight: 300;
        }
        
        /* Input area */
        .input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .input-square {
            width: 180px;
            height: 180px;
            background-color: #111;
            border: 2px solid #444;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .input-square:focus-within {
            border-color: #8B0000;
            background-color: #0a0a0a;
        }
        
        .input-label {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        
        .code-input {
            width: 100%;
            height: 70px;
            background-color: #000;
            border: 2px solid #333;
            border-radius: 0;
            color: #fff;
            font-size: 2.8rem;
            text-align: center;
            outline: none;
            font-weight: bold;
            letter-spacing: 5px;
            font-family: 'Roboto Mono', monospace;
        }
        
        .code-input:focus {
            border-color: #8B0000;
            background-color: #111;
        }
        
        /* Connect symbol */
        .connect-symbol {
            color: #8B0000;
            font-size: 2.5rem;
            font-weight: 300;
        }
        
        /* Button */
        .check-button {
            display: block;
            margin: 0 auto 40px;
            padding: 18px 80px;
            background-color: #8B0000;
            color: white;
            border: none;
            border-radius: 0;
            font-size: 1.3rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            font-family: 'Roboto Mono', monospace;
        }
        
        .check-button:hover {
            background-color: #a00000;
            transform: translateY(-2px);
        }
        
        .check-button:active {
            transform: translateY(0);
        }
        
        /* Result area */
        .result-area {
            text-align: center;
            padding: 25px;
            background-color: #111;
            border: 1px solid #333;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        
        .result-text {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .teisingai {
            color: #8B0000;
        }
        
        .neteisingai {
            color: #666;
        }
        
        /* Footer */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #555;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2.8rem;
            }
            
            .input-square {
                width: 150px;
                height: 150px;
            }
            
            .code-input {
                font-size: 2.2rem;
                height: 60px;
            }
            
            .input-area {
                gap: 20px;
            }
            
            .check-button {
                padding: 15px 50px;
                font-size: 1.1rem;
            }
            
            .result-text {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .input-square {
                width: 130px;
                height: 130px;
            }
            
            .code-input {
                font-size: 1.8rem;
                height: 50px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .input-area {
                gap: 15px;
                flex-direction: column;
            }
            
            .connect-symbol {
                font-size: 1.8rem;
                transform: rotate(90deg);
            }
            
            .check-button {
                padding: 12px 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-effect effect-1"></div>
    <div class="bg-effect effect-2"></div>
    
    <div class="container">
        <div class="title-container">
            <h1>KADO COMBO</h1>
            <div class="subtitle">KODŲ ATITIKIMO SISTEMA</div>
        </div>
        
        <div class="input-area">
            <div class="input-square">
                <div class="input-label">KODAS 1</div>
                <input type="text" class="code-input" id="code1" maxlength="4" placeholder="1001">
            </div>
            
            <div class="connect-symbol">
                ×
            </div>
            
            <div class="input-square">
                <div class="input-label">KODAS 2</div>
                <input type="text" class="code-input" id="code2" maxlength="4" placeholder="1005">
            </div>
        </div>
        
        <button class="check-button" id="checkBtn">
            TIKRINTI
        </button>
        
        <div class="result-area">
            <div class="result-text" id="resultText">
                Įveskite kodus
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 KADO COMBO | KODAI: 1001-1036</p>
        </div>
    </div>

    <script>
        // Define valid code pairs
        const validPairs = new Set([
            "1001-1005", "1001-1006", "1001-1014",
            "1002-1006", "1002-1007", "1002-1014",
            "1003-1022", "1003-1016",
            "1004-1001", "1004-1005", "1004-1014",
            "1005-1001", "1005-1004", "1005-1014", "1005-1023",
            "1006-1002", "1006-1023", "1006-1014", "1006-1001",
            "1007-1023", "1007-1019",
            "1008-1018", "1008-1014",
            "1009-1034", "1009-1032",
            "1010-1014", "1010-1033",
            "1011-1015", "1011-1012", "1011-1030", "1011-1013",
            "1012-1011", "1012-1015", "1012-1013",
            "1013-1012", "1013-1011",
            "1014-1001", "1014-1002", "1014-1004", "1014-1005", 
            "1014-1010", "1014-1008", "1014-1026",
            "1015-1027",
            "1016-1003", "1016-1031",
            "1017-1018", "1017-1008",
            "1018-1008", "1018-1017",
            "1019-1035",
            "1020-1022", "1020-1021",
            "1021-1022",
            "1022-1020", "1022-1021", "1022-1003",
            "1023-1024", "1023-1035", "1023-1005", "1023-1006", 
            "1023-1007", "1023-1030",
            "1024-1023", "1024-1015",
            "1025-1026", "1025-1014",
            "1026-1027", "1026-1025", "1026-1028", "1026-1014",
            "1027-1015",
            "1028-1026", "1028-1027", "1028-1015",
            "1029-1030", "1029-1015",
            "1030-1029", "1030-1011", "1030-1023",
            "1031-1016", "1031-1015", "1031-1027",
            "1032-1034", "1032-1009",
            "1033-1010",
            "1034-1009", "1034-1032",
            "1035-1019", "1035-1023",
            "1036-1015", "1036-1011"
        ]);

        // Get DOM elements
        const code1Input = document.getElementById('code1');
        const code2Input = document.getElementById('code2');
        const checkBtn = document.getElementById('checkBtn');
        const resultText = document.getElementById('resultText');

        // Check if codes match
        function checkCodes() {
            const code1 = code1Input.value.trim();
            const code2 = code2Input.value.trim();
            
            // Validate inputs
            if (!code1 || !code2) {
                resultText.innerHTML = 'ĮVESKITE ABU KODUS';
                resultText.className = 'result-text neteisingai';
                return;
            }
            
            if (!/^\d{4}$/.test(code1) || !/^\d{4}$/.test(code2)) {
                resultText.innerHTML = 'KODAS TURI BŪTI 4 SKAITMENŲ';
                resultText.className = 'result-text neteisingai';
                return;
            }
            
            // Check if codes are in valid range (1001-1036)
            const code1Num = parseInt(code1);
            const code2Num = parseInt(code2);
            
            if (code1Num < 1001 || code1Num > 1036 || code2Num < 1001 || code2Num > 1036) {
                resultText.innerHTML = 'KODAI TURI BŪTI NUO 1001 IKI 1036';
                resultText.className = 'result-text neteisingai';
                return;
            }
            
            // Create pair string in both possible orders
            const pair1 = `${code1}-${code2}`;
            const pair2 = `${code2}-${code1}`;
            
            // Check if pair is valid
            const isValid = validPairs.has(pair1) || validPairs.has(pair2);
            
            // Update result
            if (isValid) {
                resultText.innerHTML = 'TEISINGAI ✓';
                resultText.className = 'result-text teisingai';
                
                // Add visual feedback
                document.querySelectorAll('.input-square').forEach(square => {
                    square.style.borderColor = '#8B0000';
                    square.style.backgroundColor = '#0a0a0a';
                });
                
                // Reset after 1.5 seconds
                setTimeout(() => {
                    document.querySelectorAll('.input-square').forEach(square => {
                        square.style.borderColor = '';
                        square.style.backgroundColor = '';
                    });
                }, 1500);
            } else {
                resultText.innerHTML = 'NETEISINGAI ✗';
                resultText.className = 'result-text neteisingai';
                
                // Add visual feedback
                document.querySelectorAll('.input-square').forEach(square => {
                    square.style.borderColor = '#666';
                });
                
                // Reset after 1.5 seconds
                setTimeout(() => {
                    document.querySelectorAll('.input-square').forEach(square => {
                        square.style.borderColor = '';
                    });
                }, 1500);
            }
        }

        // Allow checking with Enter key
        code1Input.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                checkCodes();
            }
        });
        
        code2Input.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                checkCodes();
            }
        });

        // Restrict input to numbers only
        code1Input.addEventListener('input', () => {
            code1Input.value = code1Input.value.replace(/\D/g, '');
        });
        
        code2Input.addEventListener('input', () => {
            code2Input.value = code2Input.value.replace(/\D/g, '');
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            checkBtn.addEventListener('click', checkCodes);
            
            // Set initial example
            code1Input.value = '1001';
            code2Input.value = '1005';
        });
    </script>
</body>
</html>
