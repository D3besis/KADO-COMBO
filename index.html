<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KADO COMBO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #cd4c4c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* iPhone/iPad specific optimizations */
        @supports (-webkit-touch-callout: none) {
            body {
                min-height: -webkit-fill-available;
            }
        }
        
        /* Minimal background effect */
        .bg-effect {
            position: fixed;
            z-index: -1;
            opacity: 0.1;
            pointer-events: none;
        }
        
        .effect-1 {
            top: 10%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            filter: blur(40px);
        }
        
        .effect-2 {
            bottom: 10%;
            right: 10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            filter: blur(50px);
        }
        
        .container {
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 0;
            padding: 40px 30px;
            width: 100%;
            max-width: 650px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin: 20px;
        }
        
        /* Title with Montserrat */
        .title-container {
            margin-bottom: 50px;
            padding-bottom: 20px;
            position: relative;
        }
        
        h1 {
            font-size: 3.5rem;
            color: #fff;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #cd4c4c;
            letter-spacing: 2px;
            font-weight: 300;
            text-transform: uppercase;
        }
        
        /* Input area */
        .input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .input-square {
            width: 190px;
            height: 190px;
            background-color: #111;
            border: 2px solid #444;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .input-square:focus-within {
            border-color: #cd4c4c;
            background-color: #0a0a0a;
        }
        
        .input-label {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .code-input {
            width: 100%;
            height: 75px;
            background-color: #000;
            border: 2px solid #333;
            border-radius: 0;
            color: #fff;
            font-size: 2.8rem;
            text-align: center;
            outline: none;
            font-weight: 700;
            letter-spacing: 6px;
            font-family: 'Montserrat', sans-serif;
            padding: 0 10px;
        }
        
        .code-input:focus {
            border-color: #cd4c4c;
            background-color: #111;
        }
        
        .code-input::placeholder {
            color: #444;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }
        
        /* Connect symbol */
        .connect-symbol {
            color: #cd4c4c;
            font-size: 2.8rem;
            font-weight: 300;
            padding: 0 10px;
        }
        
        /* Button with #cd4c4c color */
        .check-button {
            display: block;
            margin: 0 auto 40px;
            padding: 20px 80px;
            background-color: #cd4c4c;
            color: white;
            border: none;
            border-radius: 0;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 3px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(205, 76, 76, 0.3);
            -webkit-appearance: none;
        }
        
        .check-button:hover, .check-button:active {
            background-color: #d85c5c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(205, 76, 76, 0.4);
        }
        
        /* Result area */
        .result-area {
            text-align: center;
            padding: 25px 20px;
            background-color: #111;
            border: 1px solid #333;
            min-height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        
        .result-text {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            padding: 0 10px;
        }
        
        .teisingai {
            color: #cd4c4c;
            text-shadow: 0 0 10px rgba(205, 76, 76, 0.5);
        }
        
        .neteisingai {
            color: #888;
        }
        
        /* Footer */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #cd4c4c;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            font-weight: 300;
            text-transform: uppercase;
            line-height: 1.5;
        }
        
        /* iPhone Optimization */
        @media only screen and (max-width: 768px) {
            body {
                padding: 15px;
                align-items: flex-start;
                padding-top: 40px;
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }
            
            .container {
                padding: 30px 20px;
                margin: 0;
                max-width: 95%;
            }
            
            h1 {
                font-size: 2.8rem;
                letter-spacing: 2px;
                margin-bottom: 10px;
            }
            
            .subtitle {
                font-size: 0.9rem;
                letter-spacing: 1.5px;
            }
            
            .input-area {
                gap: 20px;
                margin-bottom: 40px;
            }
            
            .input-square {
                width: 160px;
                height: 160px;
                padding: 25px 15px;
            }
            
            .input-label {
                font-size: 1.1rem;
                margin-bottom: 15px;
            }
            
            .code-input {
                height: 65px;
                font-size: 2.4rem;
                letter-spacing: 5px;
                padding: 0 8px;
            }
            
            .code-input::placeholder {
                font-size: 1.8rem;
            }
            
            .connect-symbol {
                font-size: 2.2rem;
                padding: 0 5px;
            }
            
            .check-button {
                padding: 18px 50px;
                font-size: 1.2rem;
                letter-spacing: 2px;
                width: 100%;
                max-width: 300px;
                margin-bottom: 30px;
            }
            
            .result-area {
                padding: 20px 15px;
                min-height: 90px;
            }
            
            .result-text {
                font-size: 2rem;
                letter-spacing: 1px;
                padding: 0 8px;
            }
            
            .footer {
                font-size: 0.8rem;
                letter-spacing: 1px;
                margin-top: 30px;
            }
        }
        
        /* Small phones */
        @media only screen and (max-width: 480px) {
            .container {
                padding: 25px 15px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 0.8rem;
            }
            
            .input-square {
                width: 140px;
                height: 140px;
                padding: 20px 12px;
            }
            
            .input-label {
                font-size: 1rem;
                margin-bottom: 12px;
            }
            
            .code-input {
                height: 55px;
                font-size: 2rem;
                letter-spacing: 4px;
                padding: 0 6px;
            }
            
            .code-input::placeholder {
                font-size: 1.6rem;
            }
            
            .input-area {
                gap: 15px;
                flex-direction: row;
                justify-content: space-between;
            }
            
            .connect-symbol {
                font-size: 1.8rem;
                padding: 0 3px;
            }
            
            .check-button {
                padding: 16px 30px;
                font-size: 1.1rem;
                max-width: 280px;
            }
            
            .result-text {
                font-size: 1.8rem;
            }
        }
        
        /* Very small phones (iPhone SE, etc) */
        @media only screen and (max-width: 375px) {
            .input-square {
                width: 125px;
                height: 125px;
                padding: 18px 10px;
            }
            
            .code-input {
                height: 50px;
                font-size: 1.8rem;
                letter-spacing: 3px;
            }
            
            .code-input::placeholder {
                font-size: 1.4rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .result-text {
                font-size: 1.6rem;
            }
        }
        
        /* Landscape orientation for phones */
        @media only screen and (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 20px;
            }
            
            .container {
                padding: 20px;
                max-width: 90%;
            }
            
            .title-container {
                margin-bottom: 30px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .input-square {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-effect effect-1"></div>
    <div class="bg-effect effect-2"></div>
    
    <div class="container">
        <div class="title-container">
            <h1>KADO COMBO</h1>
            <div class="subtitle">KODŲ ATITIKIMO SISTEMA</div>
        </div>
        
        <div class="input-area">
            <div class="input-square">
                <div class="input-label">KODAS 1</div>
                <input type="text" class="code-input" id="code1" maxlength="4" placeholder="____">
            </div>
            
            <div class="connect-symbol">
                ×
            </div>
            
            <div class="input-square">
                <div class="input-label">KODAS 2</div>
                <input type="text" class="code-input" id="code2" maxlength="4" placeholder="____">
            </div>
        </div>
        
        <button class="check-button" id="checkBtn">
            TIKRINTI
        </button>
        
        <div class="result-area">
            <div class="result-text" id="resultText">
                ĮVESKITE KODUS
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 KADO COMBO | KODAI: 1001-1036</p>
        </div>
    </div>

    <script>
        // Define valid code pairs (86 positive pairs - both directions)
        const validPairs = new Set([
            "1001-1005", "1005-1001",
            "1001-1006", "1006-1001",
            "1001-1014", "1014-1001",
            "1002-1006", "1006-1002",
            "1002-1007", "1007-1002",
            "1002-1014", "1014-1002",
            "1003-1022", "1022-1003",
            "1003-1016", "1016-1003",
            "1004-1001", "1001-1004",
            "1004-1005", "1005-1004",
            "1004-1014", "1014-1004",
            "1005-1023", "1023-1005",
            "1005-1014", "1014-1005",
            "1006-1023", "1023-1006",
            "1006-1014", "1014-1006",
            "1007-1023", "1023-1007",
            "1007-1019", "1019-1007",
            "1008-1018", "1018-1008",
            "1008-1014", "1014-1008",
            "1009-1034", "1034-1009",
            "1009-1032", "1032-1009",
            "1010-1014", "1014-1010",
            "1010-1033", "1033-1010",
            "1011-1015", "1015-1011",
            "1011-1012", "1012-1011",
            "1011-1030", "1030-1011",
            "1011-1013", "1013-1011",
            "1012-1015", "1015-1012",
            "1012-1013", "1013-1012",
            "1013-1012", "1012-1013",
            "1014-1010", "1010-1014",
            "1014-1026", "1026-1014",
            "1015-1027", "1027-1015",
            "1016-1031", "1031-1016",
            "1017-1018", "1018-1017",
            "1017-1008", "1008-1017",
            "1019-1035", "1035-1019",
            "1020-1022", "1022-1020",
            "1020-1021", "1021-1020",
            "1021-1022", "1022-1021",
            "1022-1021", "1021-1022",
            "1023-1024", "1024-1023",
            "1023-1035", "1035-1023",
            "1023-1030", "1030-1023",
            "1024-1015", "1015-1024",
            "1025-1026", "1026-1025",
            "1025-1014", "1014-1025",
            "1026-1027", "1027-1026",
            "1026-1028", "1028-1026",
            "1027-1015", "1015-1027",
            "1028-1015", "1015-1028",
            "1029-1030", "1030-1029",
            "1029-1015", "1015-1029",
            "1030-1029", "1029-1030",
            "1031-1015", "1015-1031",
            "1031-1027", "1027-1031",
            "1032-1034", "1034-1032",
            "1033-1010", "1010-1033",
            "1034-1009", "1009-1034",
            "1035-1019", "1019-1035",
            "1036-1015", "1015-1036",
            "1036-1011", "1011-1036"
        ]);

        // Get DOM elements
        const code1Input = document.getElementById('code1');
        const code2Input = document.getElementById('code2');
        const checkBtn = document.getElementById('checkBtn');
        const resultText = document.getElementById('resultText');

        // Check if codes match
        function checkCodes() {
            const code1 = code1Input.value.trim();
            const code2 = code2Input.value.trim();
            
            // Validate inputs
            if (!code1 || !code2) {
                resultText.innerHTML = 'ĮVESKITE ABU KODUS';
                resultText.className = 'result-text neteisingai';
                return;
            }
            
            if (!/^\d{4}$/.test(code1) || !/^\d{4}$/.test(code2)) {
                resultText.innerHTML = 'KODAS TURI BŪTI 4 SKAITMENŲ';
                resultText.className = 'result-text neteisingai';
                return;
            }
            
            // Check if codes are in valid range (1001-1036)
            const code1Num = parseInt(code1);
            const code2Num = parseInt(code2);
            
            if (code1Num < 1001 || code1Num > 1036 || code2Num < 1001 || code2Num > 1036) {
                resultText.innerHTML = 'KODAI TURI BŪTI NUO 1001 IKI 1036';
                resultText.className = 'result-text neteisingai';
                return;
            }
            
            // Create pair string
            const pair = `${code1}-${code2}`;
            
            // Check if pair is valid
            const isValid = validPairs.has(pair);
            
            // Update result
            if (isValid) {
                resultText.innerHTML = 'TEISINGAI ✓';
                resultText.className = 'result-text teisingai';
                
                // Add visual feedback
                document.querySelectorAll('.input-square').forEach(square => {
                    square.style.borderColor = '#cd4c4c';
                    square.style.backgroundColor = '#0a0a0a';
                });
                
                // Reset after 1.5 seconds
                setTimeout(() => {
                    document.querySelectorAll('.input-square').forEach(square => {
                        square.style.borderColor = '';
                        square.style.backgroundColor = '';
                    });
                }, 1500);
            } else {
                resultText.innerHTML = 'NETEISINGAI ✗';
                resultText.className = 'result-text neteisingai';
                
                // Add visual feedback
                document.querySelectorAll('.input-square').forEach(square => {
                    square.style.borderColor = '#666';
                });
                
                // Reset after 1.5 seconds
                setTimeout(() => {
                    document.querySelectorAll('.input-square').forEach(square => {
                        square.style.borderColor = '';
                    });
                }, 1500);
            }
        }

        // Allow checking with Enter key
        code1Input.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                checkCodes();
            }
        });
        
        code2Input.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                checkCodes();
            }
        });

        // Restrict input to numbers only
        code1Input.addEventListener('input', () => {
            code1Input.value = code1Input.value.replace(/\D/g, '');
        });
        
        code2Input.addEventListener('input', () => {
            code2Input.value = code2Input.value.replace(/\D/g, '');
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            checkBtn.addEventListener('click', checkCodes);
        });

        // iPhone/iPad touch optimization
        document.addEventListener('touchstart', function() {}, {passive: true});
    </script>
</body>
</html>
